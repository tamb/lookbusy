<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installing...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .installer {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    .progress-container {
      margin-bottom: 20px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: #666;
    }

    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 4px;
      transition: width 0.3s ease;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
      );
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .file-list {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 12px;
      color: #555;
    }

    .file-list::-webkit-scrollbar {
      width: 6px;
    }

    .file-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .file-list::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }

    .file-item {
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-item.current {
      color: #667eea;
      font-weight: 500;
    }

    .file-item.done {
      color: #4caf50;
    }

    .file-icon {
      width: 16px;
      text-align: center;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="installer">
    <div class="header">
      <div class="icon">📦</div>
      <div>
        <div class="title">Installing Packages</div>
        <div class="subtitle">This may take a few minutes...</div>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-label">
        <span id="status">Installing dependencies...</span>
        <span id="percent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress" style="width: 0%"></div>
      </div>
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="footer">
      <span id="count">0 of 0 packages</span>
      <span id="time">Elapsed: 0:00</span>
    </div>
  </div>

  <script>
    const files = [
      'node_modules/@types/node/index.d.ts',
      'node_modules/typescript/lib/typescript.js',
      'node_modules/react/cjs/react.production.min.js',
      'node_modules/react-dom/cjs/react-dom.production.min.js',
      'node_modules/webpack/lib/webpack.js',
      'node_modules/babel-loader/lib/index.js',
      'node_modules/css-loader/dist/index.js',
      'node_modules/style-loader/dist/index.js',
      'node_modules/file-loader/dist/index.js',
      'node_modules/url-loader/dist/index.js',
      'node_modules/html-webpack-plugin/index.js',
      'node_modules/mini-css-extract-plugin/dist/index.js',
      'node_modules/terser-webpack-plugin/dist/index.js',
      'node_modules/eslint/lib/api.js',
      'node_modules/prettier/index.js',
      'dist/main.bundle.js',
      'dist/vendor.bundle.js',
      'dist/runtime.bundle.js',
      'dist/styles.css',
      'dist/assets/logo.png',
      'dist/assets/icons/favicon.ico',
      'public/index.html',
      'src/components/App.tsx',
      'src/components/Header.tsx',
      'src/components/Footer.tsx',
      'src/utils/api.ts',
      'src/utils/helpers.ts',
      'src/hooks/useAuth.ts',
      'src/hooks/useApi.ts',
      'config/webpack.config.js',
      'config/webpack.prod.js',
      'config/jest.config.js',
      '.env.production',
      'package.json',
      'package-lock.json',
      'tsconfig.json',
      'README.md',
    ];

    const fileList = document.getElementById('fileList');
    const progress = document.getElementById('progress');
    const percent = document.getElementById('percent');
    const status = document.getElementById('status');
    const count = document.getElementById('count');
    const timeEl = document.getElementById('time');

    let currentIndex = 0;
    let startTime = Date.now();

    function updateTime() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = Math.floor(elapsed / 60);
      const secs = elapsed % 60;
      timeEl.textContent = `Elapsed: ${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function installNext() {
      if (currentIndex >= files.length) {
        // Loop back
        fileList.innerHTML = '';
        currentIndex = 0;
      }

      const file = files[currentIndex];
      const progressPercent = Math.floor((currentIndex / files.length) * 100);

      progress.style.width = `${progressPercent}%`;
      percent.textContent = `${progressPercent}%`;
      count.textContent = `${currentIndex} of ${files.length} packages`;
      status.textContent = `Installing: ${file.split('/').pop()}`;

      // Add file to list
      const item = document.createElement('div');
      item.className = 'file-item current';
      item.innerHTML = `
        <span class="file-icon"><div class="spinner"></div></span>
        <span>${file}</span>
      `;
      fileList.appendChild(item);
      fileList.scrollTop = fileList.scrollHeight;

      // Mark as done after delay
      setTimeout(() => {
        item.className = 'file-item done';
        item.querySelector('.file-icon').innerHTML = '✓';
      }, 200);

      currentIndex++;
      
      // Keep list manageable
      while (fileList.children.length > 15) {
        fileList.removeChild(fileList.firstChild);
      }
    }

    // Initial install
    installNext();

    // Continue installing
    setInterval(installNext, 400);
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
